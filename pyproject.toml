[project]
name = "finops-wizard"
version = "0.1.0"
description = "FinOps discovery, inventory, analysis, local dashboard, and alerting CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "questionary>=2.0.0",
    "httpx>=0.20.0",
    "pytest>=8.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
finops-wizard = "finops_wizard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
